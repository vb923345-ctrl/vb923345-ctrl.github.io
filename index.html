<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quiz Page — Monetag-friendly (No Impression Pixels)</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; background:#f6f7fb; margin:0; padding:20px; }
    h1 { font-size:20px; margin-bottom:12px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; }
    .quiz-button {
      background:#3178c6; color:white; border:none; border-radius:10px; padding:14px;
      text-align:center; font-size:16px; cursor:pointer; display:block; text-decoration:none;
      box-shadow:0 4px 8px rgba(0,0,0,0.08);
    }
    .quiz-button[aria-disabled="true"] { opacity:0.6; pointer-events:none; }
    .meta { margin-top:14px; color:#333; font-size:13px; }
    .debug {
      margin-top:18px; padding:12px; background:#fff; border:1px solid #e0e4ea; border-radius:8px;
      font-family:monospace; font-size:13px; color:#111;
    }
    .small { font-size:12px; color:#666; }
    footer { margin-top:18px; font-size:12px; color:#666; }
  </style>
</head>
<body>

  <h1>Select a Quiz</h1>

  <!-- Replace placeholders with your Monetag click-tracking URLs -->

  <div class="grid" id="quizGrid"></div>

  <div class="meta">
    <div>Click behavior: <strong>same-tab navigation</strong> (recommended for reliable attribution).</div>
    <div class="small">Buttons are disabled briefly after click to reduce duplicate clicks.</div>
  </div>

  <div class="debug" id="debug">
    <div><strong>Debug / Last events</strong></div>
    <div id="debugContent">No events yet.</div>
  </div>

<script>

/* ========== CONFIG: Monetag click URLs only ========== */

const clickUrls = [
  "https://otieu.com/4/10189068",
  "https://otieu.com/4/10189077",
  "https://otieu.com/4/10189073",
  "https://otieu.com/4/10189069",
  "https://otieu.com/4/10189075",
  "https://otieu.com/4/10189081",
  "https://otieu.com/4/10189074",
  "https://otieu.com/4/10189078",
  "https://otieu.com/4/10189070",
  "https://otieu.com/4/10189076"
];

const quizLabels = [
  "Quiz 1 — Brain Teaser",
  "Quiz 2 — Logic Test",
  "Quiz 3 — Knowledge Check",
  "Quiz 4 — Memory Quiz",
  "Quiz 5 — Puzzle Round",
  "Quiz 6 — Quick Test",
  "Quiz 7 — Challenge Mode",
  "Quiz 8 — Speed Quiz",
  "Quiz 9 — Skill Check",
  "Quiz 10 — Final Round"
];

/* Throttling settings */
const disableSeconds = 6;
const dedupeWindowSeconds = 30;

const quizGrid = document.getElementById('quizGrid');
const debugContent = document.getElementById('debugContent');

function debugLog(msg) {
  const time = new Date().toLocaleTimeString();
  debugContent.innerHTML = `[${time}] ${msg}<br>` + debugContent.innerHTML;
  console.log(`[quiz-debug] ${msg}`);
}

function getLastClickTime(index) {
  return parseInt(localStorage.getItem('quiz_last_click_' + index) || '0', 10);
}
function setLastClickTime(index, t) {
  localStorage.setItem('quiz_last_click_' + index, String(t));
}

/* Create buttons */
for (let i = 0; i < 10; i++) {
  const a = document.createElement('a');
  a.className = 'quiz-button';
  a.href = clickUrls[i] || '#';
  a.textContent = quizLabels[i];
  a.dataset.index = i;
  a.onclick = (e) => {
    e.preventDefault();
    handleQuizClick(i);
  };
  quizGrid.appendChild(a);
}

function handleQuizClick(index) {
  const btn = document.querySelector(`.quiz-button[data-index="${index}"]`);
  const now = Date.now();
  const last = getLastClickTime(index);
  const secondsSince = Math.round((now - last) / 1000);

  if (last && secondsSince < dedupeWindowSeconds) {
    debugLog(`Duplicate click detected for Quiz ${index+1} (+${secondsSince}s)`);
  }

  if (btn) {
    btn.setAttribute('aria-disabled', 'true');
    setTimeout(() => btn.removeAttribute('aria-disabled'), disableSeconds * 1000);
  }

  setLastClickTime(index, now);

  const url = clickUrls[index];
  if (!url || url === '#') {
    debugLog(`No click URL added for Quiz ${index+1}`);
    return;
  }

  debugLog(`Navigating to: ${url}`);
  window.location.href = url;  // Same-tab redirect
}

</script>
</body>
</html>
